title = "Pulse secrets and Gitleaks default rules"

[extend]
useDefault = true

[[rules]]
id = "pulse-secret-literal"
description = "A literal assigned to a Pulse secret, including a setup phrase"
regex = '''(?i)\b(?:DASHBOARD_SETUP_CODE|SHOPIFY_CLIENT_(?:ID|SECRET)|META_ACCESS_TOKEN|GOOGLE_ADS_(?:CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)|MAILCHIMP_API_KEY|GITHUB_HQ_TOKEN|GORGIAS_(?:DOMAIN|EMAIL|API_KEY)|JUDGEME_API_TOKEN|DISCORD_BOT_TOKEN|UGC_FEED_TOKEN|ANTHROPIC_API_KEY)\b["']?\s*[:=]\s*["']([^"'\r\n]+)["']'''
secretGroup = 1

[[rules]]
id = "pulse-secret-dotenv"
description = "An unquoted Pulse secret in a dotenv file or shell assignment"
regex = '''(?im)^[ \t]*(?:export[ \t]+)?(?:DASHBOARD_SETUP_CODE|SHOPIFY_CLIENT_(?:ID|SECRET)|META_ACCESS_TOKEN|GOOGLE_ADS_(?:CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)|MAILCHIMP_API_KEY|GITHUB_HQ_TOKEN|GORGIAS_(?:DOMAIN|EMAIL|API_KEY)|JUDGEME_API_TOKEN|DISCORD_BOT_TOKEN|UGC_FEED_TOKEN|ANTHROPIC_API_KEY)[ \t]*=[ \t]*([^"'$`\s][^\r\n]*)$'''
secretGroup = 1
